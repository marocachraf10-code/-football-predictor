<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توقعات كرة القدم</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--tx:#14201a;--mu:#5d6b63;--h:#12803f;--d:#8a949b;--a:#c4571d;--bd:#dde3de}
@media(prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#18211c;--tx:#e8f0ea;--mu:#9aa9a0;--h:#3fbf74;--bd:#2a362f}}
body{margin:0;padding:14px;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif}
.w{max-width:700px;margin:auto}
select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
small{display:block;color:var(--mu);margin:2px 0 8px}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;color:#fff;font-weight:700;font-size:.85rem;margin:6px 0}
.bar div{display:flex;align-items:center;justify-content:center}
.r{display:flex;justify-content:space-between;font-size:.9rem;padding:3px 0}
</style>
</head>
<body>
<div class="w">
<h1>⚽ توقعات كرة القدم</h1>
<select id="c" onchange="load()">
<option value="PL">الدوري الإنجليزي</option>
<option value="PD">الدوري الإسباني</option>
<option value="SA">الدوري الإيطالي</option>
<option value="BL1">الدوري الألماني</option>
<option value="FL1">الدوري الفرنسي</option>
<option value="CL">دوري الأبطال</option>
</select>
<div id="o"></div>
<p><small>نموذج إحصائي تقريبي. ماكاين حتى توقع مضمون.</small></p>
</div>
<script>
const $ = (s) => document.querySelector(s);
const pc = (x) => Math.round(x * 100) + "%";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function card(m) {
  const mx = Math.max(m.h, m.d, m.a);
  const pick = mx === m.h ? "فوز " + m.home : mx === m.a ? "فوز " + m.away : "تعادل";
  return `<div class="c"><b>${esc(m.home)} ⚔️ ${esc(m.away)}</b>
<small>${new Date(m.date).toLocaleString("ar-MA")}</small>
<div>🎯 <b>${esc(pick)}</b> (النتيجة الأرجح ${m.top[0][0]})</div>
<div class="bar"><div style="width:${m.h * 100}%;background:var(--h)">${pc(m.h)}</div><div style="width:${m.d * 100}%;background:var(--d)">${pc(m.d)}</div><div style="width:${m.a * 100}%;background:var(--a)">${pc(m.a)}</div></div>
<div class="r"><span>أهداف متوقعة</span><b>${m.xh.toFixed(2)} - ${m.xa.toFixed(2)}</b></div>
<div class="r"><span>أكثر من 2.5 هدف</span><b>${pc(m.o25)}</b></div>
<div class="r"><span>الفريقان يسجلان</span><b>${pc(m.bt)}</b></div></div>`;
}
async function load() {
  const o = $("#o");
  o.textContent = "كنحمل...";
  try {
    const r = await fetch("/api/predict?comp=" + $("#c").value);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    o.innerHTML = j.length ? j.map(card).join("") : "ما كاينة حتى مباراة فالـ 3 أيام الجاية";
  } catch (e) {
    o.textContent = "خطأ: " + e.message;
  }
}
load();
</script>
</body>
</html>
